apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-api
  labels:
    app: stub-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: stub-api
  template:
    metadata:
      labels:
        app: stub-api
    spec:
      containers:
      - name: rounds-api # Name of the container
        image: 961328178101.dkr.ecr.ap-south-1.amazonaws.com/rounds-api:v8.3.18
        imagePullPolicy: IfNotPresent
        env:
        - name: ROUNDS_ENABLE_APPS
          value: stub
        - name: ROUNDS_ENV # For Secrets Manager
          value: dev
        # command: ["sleep","10000"]
        command: ["/bin/sh","-c"]
        args: ["cp /settings/local_settings.py /app/kernel/local_settings.py && python3 runserver.py"]
        ports:
        - containerPort: 8000 # Port that the container expose
        resources:
          requests:
            memory: "300M"
            cpu: "100m"
          limits:
            memory: "300M"
            cpu: "100m"
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        volumeMounts:
        - name: stub-api-local-settings
          mountPath: /settings
          readOnly: true
        - name: key1
          mountPath: /etc/ssh-key1
        - name: key2
          mountPath: /etc/ssh-key2
      nodeSelector:
        workload: dr-api
      volumes:
      - name: stub-api-local-settings
        configMap:
          name: stub-api-local-settings
      - name: key1
        secret:
          secretName: 3176b6db91af79067cbb902a90bdffd3
      - name: key2
        secret:
          secretName: pk