includes:
 - 'common.yaml'   # ❌ wrong indentation (should be two spaces)

deliverables:
  - name: 'HTML5'
    context:
      idref 'html'   # ❌ missing colon
    output: '.'
    publication:
      transtype: 'html5'
      params:
        - name: 'args.copycss'
          value: 'yes'
        - name: 'args.css'
          value: 'dita-ot-doc.css'
        - name: 'args.csspath'
          value: 'css'
        - name: 'args.cssroot'
          path: '../../resources'
